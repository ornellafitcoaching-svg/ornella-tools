<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#C96358;--accent-light:#FAECE7;--accent-dark:#993C1D;
  --bg:#FAF8F5;--surface:#FFFFFF;--surface2:#F5F2EE;
  --text:#1E1616;--text2:#7A6E6E;--text3:#B0A8A8;
  --border:#E8E0D8;--border2:#D4C8C0;
  --green:#3B6D11;--green-bg:#EAF3DE;
  --amber:#854F0B;--amber-bg:#FAEEDA;
  --blue:#185FA5;--blue-bg:#E6F1FB;
  --red:#993C1D;--red-bg:#FAECE7;
  --radius:14px;--radius-sm:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px}
/* HEADER */
.app-header{background:var(--surface);padding:16px 20px 12px;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between}
.app-title{font-size:17px;font-weight:600;color:var(--text)}
.app-date{font-size:12px;color:var(--text2);margin-top:1px}
.btn-add{background:var(--accent);color:white;border:none;border-radius:20px;padding:7px 16px;font-size:13px;font-weight:600;cursor:pointer}
/* TABS */
.tabs{display:flex;background:var(--surface);border-bottom:1px solid var(--border);padding:0 20px;gap:0}
.tab{flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:500;color:var(--text2);border:none;background:none;cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
/* SECTIONS */
.section{display:none;padding:14px 16px;min-height:200px}
.section.active{display:block}
/* CLIENT CARD */
.card{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--border);cursor:pointer;transition:transform .1s,border-color .2s}
.card:active{transform:scale(0.98);border-color:var(--border2)}
.card-header{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.avatar{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0}
.cname{font-size:14px;font-weight:600;color:var(--text)}
.coffre{font-size:11px;color:var(--text2);margin-top:2px}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;margin-left:auto;flex-shrink:0}
.badge-actif{background:var(--green-bg);color:var(--green)}
.badge-termine{background:var(--surface2);color:var(--text2)}
.prog-bar{height:5px;background:var(--surface2);border-radius:3px;overflow:hidden;margin:6px 0}
.prog-fill{height:100%;border-radius:3px;transition:width .3s}
.stats-row{display:flex;gap:6px;margin-top:6px}
.stat{flex:1;background:var(--surface2);border-radius:var(--radius-sm);padding:6px 8px}
.stat-l{font-size:10px;color:var(--text2)}
.stat-v{font-size:12px;font-weight:600;color:var(--text);margin-top:1px}
/* ALERT CARD */
.alert-card{background:var(--amber-bg);border-radius:var(--radius-sm);padding:10px 13px;margin-bottom:8px;border-left:3px solid #EF9F27;cursor:pointer}
.alert-name{font-size:13px;font-weight:600;color:var(--amber)}
.alert-info{font-size:11px;color:#633806;margin-top:2px}
/* VIEWS */
.view{display:none}
.view.active{display:block}
/* BACK BTN */
.back-btn{background:none;border:none;color:var(--accent);font-size:14px;font-weight:500;cursor:pointer;padding:16px 20px 10px;display:flex;align-items:center;gap:4px;width:100%}
/* DETAIL */
.detail-wrap{padding:0 16px 30px}
.detail-head{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.detail-name{font-size:18px;font-weight:700;color:var(--text)}
.detail-sub{font-size:12px;color:var(--text2);margin-top:2px}
.dcard{background:var(--surface);border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--border)}
.dcard-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.dcard-edit{font-size:12px;color:var(--accent);font-weight:500;background:none;border:none;cursor:pointer;text-transform:none;letter-spacing:0}
.big-num{text-align:center;margin-bottom:8px}
.big-num span:first-child{font-size:36px;font-weight:700;color:var(--text)}
.big-num span:last-child{font-size:18px;color:var(--text2)}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--border)}
.info-row:last-child{border-bottom:none}
.info-l{font-size:12px;color:var(--text2)}
.info-v{font-size:12px;font-weight:600;color:var(--text);text-align:right;max-width:60%}
.seance-btn{width:100%;padding:13px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;margin-top:10px}
.seance-btn:disabled{background:var(--surface2);color:var(--text3);cursor:not-allowed}
.whatsapp-btn{width:100%;padding:11px;background:#25D366;color:white;border:none;border-radius:var(--radius-sm);font-size:13px;font-weight:600;cursor:pointer;margin-top:6px;display:flex;align-items:center;justify-content:center;gap:8px}
.action-btn{width:100%;padding:11px;background:var(--surface);color:var(--text);border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:13px;font-weight:500;cursor:pointer;margin-bottom:6px;text-align:left}
.danger-btn{width:100%;padding:10px;background:none;border:1px solid #E24B4A;border-radius:var(--radius-sm);font-size:12px;color:#E24B4A;cursor:pointer;margin-top:4px}
/* MENSURATIONS GRID */
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.m-item{background:var(--surface2);border-radius:var(--radius-sm);padding:8px 10px}
.m-label{font-size:10px;color:var(--text2)}
.m-val{font-size:15px;font-weight:700;color:var(--text);margin-top:1px}
.m-diff{font-size:10px;margin-top:2px;font-weight:600}
.m-diff.pos{color:#E24B4A}
.m-diff.neg{color:var(--green)}
/* HISTORIQUE MENSURATIONS */
.histo-table{width:100%;font-size:11px;border-collapse:collapse}
.histo-table th{font-weight:600;color:var(--text2);padding:4px 6px;border-bottom:1px solid var(--border);text-align:left}
.histo-table td{padding:5px 6px;border-bottom:1px solid var(--border);color:var(--text)}
.histo-table tr:last-child td{border-bottom:none}
.chart-bar-wrap{margin-top:10px}
.chart-label{font-size:11px;color:var(--text2);margin-bottom:4px}
.chart-bars{display:flex;align-items:flex-end;gap:4px;height:60px}
.chart-bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px}
.chart-bar{width:100%;background:var(--accent-light);border-radius:3px 3px 0 0;transition:height .3s;min-height:2px;position:relative}
.chart-bar.latest{background:var(--accent)}
.chart-date{font-size:8px;color:var(--text3);text-align:center}
.chart-val{font-size:8px;color:var(--text2);text-align:center}
/* FORM */
.form-wrap{padding:0 16px 40px}
.form-section-title{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.form-group{margin-bottom:10px}
.form-label{font-size:12px;color:var(--text2);margin-bottom:4px;display:block;font-weight:500}
.form-input{width:100%;padding:10px 12px;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:14px;background:var(--surface);color:var(--text);-webkit-appearance:none}
.form-input:focus{outline:none;border-color:var(--accent)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.save-btn{width:100%;padding:14px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);font-size:15px;font-weight:700;cursor:pointer;margin-top:14px}
/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1E1616;color:white;padding:10px 20px;border-radius:20px;font-size:13px;font-weight:500;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;white-space:nowrap}
.toast.show{opacity:1}
/* EMPTY */
.empty{text-align:center;padding:30px 20px;color:var(--text2);font-size:13px}
/* UNDO + NOTIF */
.undo-btn{width:100%;padding:8px;background:none;border:1px solid var(--border2);border-radius:var(--radius-sm);font-size:12px;color:var(--text2);cursor:pointer;margin-top:5px}
.undo-btn:disabled{opacity:0.35;cursor:not-allowed}
.notif-btn{background:none;border:none;font-size:20px;cursor:pointer;padding:2px 6px;opacity:0.7}
.notif-btn.on{opacity:1}
</style>
</head>

function initials(n){return n.split(' ').slice(0,2).map(function(x){return (x[0]||'').toUpperCase();}).join('');}
function colFor(c){return COLORS[(c.ci||0)%COLORS.length];}
function gv(id){var e=document.getElementById(id);return e?e.value.trim():'';}
function gn(id){var v=parseFloat(gv(id));return isNaN(v)?null:v;}
function today(){return new Date().toLocaleDateString('fr-FR');}
function formatTel(tel){
  if(!tel)return null;
  var t=tel.replace(/\D/g,'');
  if(t.startsWith('0'))t='33'+t.slice(1);
  return t;
}

function showTab(name){

function badge(s){
  return s==='Actif'?'<span class="badge badge-actif">Actif</span>':'<span class="badge badge-termine">Terminé</span>';
}
function progBar(c){
  if(!c.seancesPrevues)return '';
  var pct=Math.round(c.seancesEffectuees/c.seancesPrevues*100);
  var barCol=pct>=100?'#3B6D11':pct>=70?'#C96358':'#378ADD';
  return '<div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%;background:'+barCol+'"></div></div>';
}

function renderCard(c){
  var cl=colFor(c);
  var seances=c.seancesPrevues?(c.seancesEffectuees+'/'+c.seancesPrevues):'-';
  var reste=c.seancesPrevues?((c.seancesPrevues-c.seancesEffectuees)+' rest.'):'-';
  var payeStr=c.paye?c.paye+'€':'—';
  var payeColor=(c.paye&&c.montant&&c.paye>=c.montant)?'color:#3B6D11':'';
  return '<div class="card" onclick="showDetail('+c.id+')">'+
    '<div class="card-header">'+
    '<div class="avatar" style="background:'+cl.bg+';color:'+cl.tx+'">'+initials(c.nom)+'</div>'+
    '<div style="flex:1"><div class="cname">'+c.nom+'</div><div class="coffre">'+c.offre+'</div></div>'+
    badge(c.statut)+'</div>'+progBar(c)+
    '<div class="stats-row">'+
    '<div class="stat"><div class="stat-l">Séances</div><div class="stat-v">'+seances+'</div></div>'+
    '<div class="stat"><div class="stat-l">Restantes</div><div class="stat-v">'+reste+'</div></div>'+
    '<div class="stat"><div class="stat-l">Payé '+(c.montant&&c.paye>=c.montant?'✅':c.paye?'⏳':'')+'</div><div class="stat-v" style="'+payeColor+'">'+payeStr+(c.montant?' / '+c.montant+'€':'')+'</div></div>'+
    '</div></div>';
}

function bilanDuCeMois(c){
  if(!c.debut||c.statut!=='Actif')return false;
  var d=parseDateFR(c.debut);
  if(!d||isNaN(d.getTime()))return false;
  var now=new Date();
  var moisCle=now.getFullYear()+'-'+(now.getMonth()+1);
  if(c.dernierBilanEnvoye===moisCle)return false;
  return now.getDate()>=d.getDate();
}

function sendBilanWA(id){
  var c=clients.find(function(x){return x.id===id;});
  if(!c)return;
  var msg='Bonjour '+c.nom.split(' ')[0]+' 😊\n\nC\'est l\'heure de ton bilan mensuel ! Prends 2 minutes pour remplir ce petit formulaire (poids, mensurations...) — ça m\'aide à ajuster ton programme au mieux 💪\n\n'+GOOGLE_FORM_BILAN_URL+'\n\nMerci !';
  openWA(c.telephone, msg);
  var now=new Date();
  c.dernierBilanEnvoye=now.getFullYear()+'-'+(now.getMonth()+1);
  save();
  renderAlertes();
  toast('Bilan envoyé à '+c.nom.split(' ')[0]+' ✅');
}

  html+=alertes.length?alertes.map(function(c){
      return '<div class="alert-card" onclick="showDetail('+c.id+')">'+
        '<div class="alert-name">'+c.nom+'</div>'+
        '<div class="alert-info">'+(c.seancesPrevues-c.seancesEffectuees)+' séance(s) restante(s) · '+c.offre+'</div></div>';

  html+='<div style="font-weight:700;font-size:13px;color:var(--text2);margin:18px 0 8px">🗓️ Bilans mensuels à envoyer</div>';
  html+=bilans.length?bilans.map(function(c){

        '<div class="alert-name">'+c.nom+'</div>'+
        '<div class="alert-info">Cliente depuis le '+c.debut+'</div>'+

        '</div>';
    }).join(''):'<div class="empty">Aucun bilan à envoyer ce mois-ci</div>';
  document.getElementById('section-alertes').innerHTML=html;
}

function renderAll(){

    MFIELDS.forEach(function(f){
      var withField=sorted.filter(function(m){return m[f.key]!=null;});
      if(!withField.length)return;
      var lastVal=withField[withField.length-1][f.key];
      var prevVal=withField.length>1?withField[withField.length-2][f.key]:null;
      var firstVal=withField[0][f.key];
      var isLoss=lossFields.indexOf(f.key)>=0;
      var totalHtml='',prevHtml='';
      if(withField.length>1){
        var dt=parseFloat((lastVal-firstVal).toFixed(1));
        var signT=dt>0?'+':'';
        var goodT=isLoss?(dt<0):(dt>0);
        totalHtml='<div class="m-diff '+(goodT?'neg':'pos')+'">'+signT+dt+' '+f.unit+' <span style="font-size:9px;opacity:.65">depuis début</span></div>';
      }
      if(prevVal!==null){
        var d=parseFloat((lastVal-prevVal).toFixed(1));
        var signP=d>0?'+':'';
        var goodP=isLoss?(d<0):(d>0);
        prevHtml='<div style="font-size:10px;margin-top:2px;color:'+(goodP?'var(--green)':'var(--text3)')+'">vs préc. : '+signP+d+' '+f.unit+'</div>';
      }
      html+='<div class="m-item"><div class="m-label">'+f.label+'</div><div class="m-val">'+lastVal+' '+f.unit+'</div>'+totalHtml+prevHtml+'</div>';
    });
    html+='</div>';

    // Graphiques triés chronologiquement
    var chartKeys=[{key:'poids',label:'Poids',unit:'kg'},{key:'tourTaille',label:'Tour taille',unit:'cm'},{key:'tourHanches',label:'Hanches',unit:'cm'},{key:'tourFessiers',label:'Fessiers',unit:'cm'}];
    chartKeys.forEach(function(f){
      var data=sorted.filter(function(m){return m[f.key]!=null;});
      if(data.length<2)return;
      var vals=data.map(function(m){return m[f.key];});
      var maxV=Math.max.apply(null,vals),minV=Math.min.apply(null,vals),range=maxV-minV||1;
      html+='<div class="chart-bar-wrap"><div class="chart-label">'+f.label+' ('+f.unit+')</div><div class="chart-bars">';
      data.forEach(function(m,i){
        var h=Math.round(((m[f.key]-minV)/range)*50)+10;
        var isLast=i===data.length-1;
        html+='<div class="chart-bar-col">'+
          '<div class="chart-val">'+m[f.key]+'</div>'+
          '<div class="chart-bar'+(isLast?' latest':'')+'" style="height:'+h+'px"></div>'+
          '<div class="chart-date">'+m.date.split('/').slice(0,2).join('/')+'</div>'+
          '</div>';
      });
      html+='</div></div>';
    });

    // Tableau historique trié par date décroissante
    var usedKeys=MFIELDS.filter(function(f){return mesures.some(function(m){return m[f.key]!=null;});});
    html+='<div style="margin-top:12px;overflow-x:auto"><table class="histo-table"><thead><tr><th>Date</th>';
    usedKeys.forEach(function(f){html+='<th>'+f.label+'</th>';});
    html+='<th></th></tr></thead><tbody>';
    sorted.slice().reverse().forEach(function(m){
      var origIdx=mesures.indexOf(m);
      html+='<tr><td>'+m.date+'</td>';
      usedKeys.forEach(function(f){html+='<td>'+(m[f.key]!=null?m[f.key]+' '+f.unit:'—')+'</td>';});
      html+='<td><button onclick="editMension('+c.id+','+origIdx+')" style="background:none;border:none;color:var(--accent);font-size:13px;cursor:pointer;padding:2px 6px">✏️</button></td>';
      html+='</tr>';
    });
    html+='</tbody></table></div>';
  }
  html+='</div>';

  // ── INFOS COACHING ───────────────────────────────────────────
  html+='<div class="dcard"><div class="dcard-title">Coaching</div>';
  var rows1=[['Offre',c.offre],['Début',c.debut],['Jours',c.joursPreferes],['Antécédents',c.antecedents],['Notes',c.notes]];
  rows1.forEach(function(r){if(r[1])html+='<div class="info-row"><span class="info-l">'+r[0]+'</span><span class="info-v">'+r[1]+'</span></div>';});
  html+='</div>';

  // ── CONTACT ──────────────────────────────────────────────────
  html+='<div class="dcard"><div class="dcard-title">Contact & Admin</div>';
  var adresseStr=(c.adresse?c.adresse+' ':'')+((c.codePostal||c.ville)?(c.codePostal?c.codePostal+' ':'')+c.ville:'');
  var rows2=[
    ['Âge',c.age?c.age+' ans':''],
    ['Email',c.email],
    ['Téléphone',c.telephone],
    ['Adresse',adresseStr],
    ['Contrat',c.contratSigne?'✅ Signé':'❌ Non signé'],
    ['CGV',c.cgvAcceptees?'✅ Acceptées':'❌ Non acceptées']
  ];
  rows2.forEach(function(r){if(r[1])html+='<div class="info-row"><span class="info-l">'+r[0]+'</span><span class="info-v">'+r[1]+'</span></div>';});
  html+='</div>';

  html+='<button class="action-btn" onclick="showForm('+c.id+')">✏️ Modifier la fiche</button>';
  html+='<button class="action-btn" onclick="sendAvisWA('+c.id+')">⭐ Demander avis Google à '+c.nom.split(' ')[0]+'</button>';
  html+='<button class="action-btn" onclick="sendRelanceWA('+c.id+')">🔄 Relancer pour renouvellement</button>';
  html+='<button class="danger-btn" onclick="deleteClient('+c.id+')">Supprimer cette cliente</button>';

  document.getElementById('detail-content').innerHTML=html;
  showView('view-detail');
}

// ── WHATSAPP ──────────────────────────────────────────────────
function openWA(tel, msg){
  var t=formatTel(tel);
  if(!t){
    navigator.clipboard&&navigator.clipboard.writeText(msg);
    toast('Numéro manquant — message copié 📋');
    return;
  }
  window.open('https://wa.me/'+t+'?text='+encodeURIComponent(msg));
}

function sendWA(id){
  var c=clients.find(function(x){return x.id===id;});
  if(!c)return;
  var reste=c.seancesPrevues?(c.seancesPrevues-c.seancesEffectuees):null;
  var msg='Bonjour '+c.nom.split(' ')[0]+' 😊\n\n';
  msg+='Petit point sur ton coaching :\n';
  msg+='📋 Séances : '+c.seancesEffectuees+(c.seancesPrevues?'/'+c.seancesPrevues:'');
  if(reste!==null)msg+=' ('+reste+' restante'+(reste>1?'s':'')+')\n';
  else msg+='\n';
  msg+='💪 Continue comme ça, tu assures !';
  openWA(c.telephone, msg);
}

function sendAvisWA(id){
  var c=clients.find(function(x){return x.id===id;});
  if(!c)return;
  var msg='Bonjour '+c.nom.split(' ')[0]+' 😊\n\nJ\'espère que tu vas bien ! Tu serais disponible pour me laisser un avis Google ? Ça m\'aide énormément à me faire connaître 🙏\n\n[Colle ici ton lien Google]\n\nMerci beaucoup ! 💛';
  openWA(c.telephone, msg);
}

function sendRelanceWA(id){
  var c=clients.find(function(x){return x.id===id;});
  if(!c)return;
  var msg='Bonjour '+c.nom.split(' ')[0]+' 😊\n\nTon coaching touche à sa fin — j\'ai adoré travailler avec toi et je vois de vrais progrès ! 💪\n\nTu veux qu\'on continue ensemble ? Je t\'explique les options disponibles si tu es intéressée !';
  openWA(c.telephone, msg);
}

// ── SÉANCES ───────────────────────────────────────────────────
function addSeance(id){
  var c=clients.find(function(x){return x.id===id;});
  if(!c||!c.seancesPrevues||c.seancesEffectuees>=c.seancesPrevues)return;
  if(!confirm('Valider une séance pour '+c.nom.split(' ')[0]+' ?\n'+c.seancesEffectuees+' → '+(c.seancesEffectuees+1)+' / '+c.seancesPrevues))return;
  c.seancesEffectuees++;save();
  var reste=c.seancesPrevues-c.seancesEffectuees;
  toast('Séance validée — '+c.seancesEffectuees+'/'+c.seancesPrevues);
  if(reste<=2&&reste>=0) notifAlerte(c.nom, reste);
  showDetail(id);
}

function annulerSeance(id){
  var c=clients.find(function(x){return x.id===id;});
  if(!c||c.seancesEffectuees<=0)return;
  if(!confirm('Annuler la dernière séance de '+c.nom.split(' ')[0]+' ?\n'+(c.seancesEffectuees)+' → '+(c.seancesEffectuees-1)+' / '+c.seancesPrevues))return;
  c.seancesEffectuees--;save();
  toast('Séance annulée — '+c.seancesEffectuees+'/'+c.seancesPrevues);
  showDetail(id);
}

function saveMension(id){
  var c=clients.find(function(x){return x.id===id;});
  if(!c)return;
  var dateVal=gv('mn-date')||today();
  var m={date:dateVal};
  var hasVal=false;
  MFIELDS.forEach(function(f){var v=gn('mn-'+f.key);m[f.key]=v;if(v)hasVal=true;});
  if(!hasVal){toast('Saisis au moins une valeur');return;}
  if(!c.mesures)c.mesures=[];
  c.mesures.push(m);sortMesures(c.mesures);save();
  toast('Mesures enregistrées !');
  showDetail(id);
}

function editMension(id,idx){
  var c=clients.find(function(x){return x.id===id;});
  if(!c||!c.mesures||!c.mesures[idx])return;
  var m=c.mesures[idx];
  document.getElementById('mension-back').onclick=function(){showDetail(id);};
  var html='<div style="font-size:15px;font-weight:700;margin-bottom:4px">Modifier mesure — '+c.nom.split(' ')[0]+'</div>';
  html+='<div class="form-group" style="margin-top:12px"><label class="form-label">Date de la mesure</label>'+
    '<input class="form-input" id="mn-date" type="text" placeholder="JJ/MM/AAAA" value="'+m.date+'"></div>';
  html+='<div class="form-section-title">Mesures</div>';
  for(var i=0;i<MFIELDS.length;i+=2){
    html+='<div class="form-row">';
    [MFIELDS[i],MFIELDS[i+1]].forEach(function(f){
      if(!f)return;
      html+='<div class="form-group"><label class="form-label">'+f.label+' ('+f.unit+')</label>'+
        '<input class="form-input" id="mn-'+f.key+'" type="number" step="0.1" value="'+(m[f.key]||'')+'"></div>';
    });
    html+='</div>';
  }
  html+='<button class="save-btn" onclick="saveMensionEdit('+id+','+idx+')">Enregistrer les modifications</button>';
  html+='<button class="danger-btn" style="margin-top:8px" onclick="deleteMension('+id+','+idx+')">Supprimer cette mesure</button>';
  document.getElementById('mension-content').innerHTML=html;
  showView('view-mension');
}

function saveMensionEdit(id,idx){
  var c=clients.find(function(x){return x.id===id;});
  if(!c||!c.mesures||!c.mesures[idx])return;
  var dateVal=gv('mn-date')||today();
  var m={date:dateVal};var hasVal=false;
  MFIELDS.forEach(function(f){var v=gn('mn-'+f.key);m[f.key]=v;if(v)hasVal=true;});
  if(!hasVal){toast('Saisis au moins une valeur');return;}
  c.mesures[idx]=m;sortMesures(c.mesures);save();
  toast('Mesure mise à jour !');showDetail(id);
}

function deleteMension(id,idx){
  if(!confirm('Supprimer cette mesure ?'))return;
  var c=clients.find(function(x){return x.id===id;});
  if(!c||!c.mesures)return;
  c.mesures.splice(idx,1);save();
  toast('Mesure supprimée');showDetail(id);
}

function onOffreChange(){
  var sel=document.getElementById('f-offre-sel');
  var wrap=document.getElementById('f-offre-mesure-wrap');
  var val=sel.value;
  wrap.style.display=val==='__mesure__'?'block':'none';
  var offre=OFFRES.find(function(o){return o.val===val;});
  if(offre){
    if(offre.prix){document.getElementById('f-mont').value=offre.prix;}
    if(offre.seances){document.getElementById('f-sp').value=offre.seances;}
  }
}

function getOffreVal(){
  var sel=document.getElementById('f-offre-sel');
  if(!sel)return '';
  return sel.value==='__mesure__'?gv('f-offre-mesure'):sel.value;
}

function saveForm(id){
  var nom=gv('f-nom');
  if(!nom){toast('Prénom et nom requis');return;}
  var sp=gn('f-sp'),se=gn('f-se');
  if(id){
    var c=clients.find(function(x){return x.id===id;});
    if(c){
      c.nom=nom;c.age=gn('f-age');c.email=gv('f-email');c.telephone=gv('f-tel');
      c.adresse=gv('f-adresse');c.codePostal=gv('f-cp');c.ville=gv('f-ville');
      c.objectif=gv('f-obj');c.lieu=gv('f-lieu');
      c.antecedents=gv('f-ant');c.joursPreferes=gv('f-jours');
      c.offre=getOffreVal();c.debut=gv('f-debut');c.statut=gv('f-statut');
      c.seancesPrevues=sp;c.seancesEffectuees=se||0;
      c.montant=gn('f-mont');c.paye=gn('f-paye');c.paiement=gv('f-paiem');c.notes=gv('f-notes');
      c.contratSigne=gv('f-contrat')==='oui';c.cgvAcceptees=gv('f-cgv')==='oui';
    }
    save();toast('Fiche mise à jour');showDetail(id);
  }else{
    var nc={id:nextId++,nom:nom,age:gn('f-age'),email:gv('f-email'),telephone:gv('f-tel'),
      adresse:gv('f-adresse'),codePostal:gv('f-cp'),ville:gv('f-ville'),
      objectif:gv('f-obj'),lieu:gv('f-lieu'),
      antecedents:gv('f-ant'),joursPreferes:gv('f-jours'),
      contratSigne:gv('f-contrat')==='oui',cgvAcceptees:gv('f-cgv')==='oui',
      offre:getOffreVal(),debut:gv('f-debut'),statut:gv('f-statut'),
      seancesPrevues:sp,seancesEffectuees:se||0,
      montant:gn('f-mont'),paye:gn('f-paye'),paiement:gv('f-paiem'),notes:gv('f-notes'),
      ci:clients.length%COLORS.length,mesures:[]};
    clients.push(nc);save();toast('Cliente ajoutée !');showDetail(nc.id);
  }
}

function deleteClient(id){
  if(!confirm('Supprimer cette cliente ?'))return;
  clients=clients.filter(function(c){return c.id!==id;});
  save();toast('Cliente supprimée');showList();
}

function toast(msg){
  var t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');
  setTimeout(function(){t.classList.remove('show');},2500);
}

// ── NOTIFICATIONS ─────────────────────────────────────────────
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').catch(function(){});
}

function updateNotifBtn(){
  var btn=document.getElementById('notif-btn');
  if(!btn)return;
  var granted=('Notification' in window)&&Notification.permission==='granted';
  btn.classList.toggle('on', granted);
  btn.title=granted?'Alertes activées ✓':'Activer les alertes iPhone';
}

function toggleNotif(){
  if(!('Notification' in window)){toast('Notifications non supportées sur ce navigateur');return;}
  if(Notification.permission==='granted'){toast('Alertes déjà activées ✓');return;}
  Notification.requestPermission().then(function(p){
    updateNotifBtn();
    if(p==='granted'){toast('Alertes activées ✓');checkAlertesNotif();}
    else toast('Permission refusée — active dans Réglages');
  });
}

function notifAlerte(nom, reste){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var msg=reste===0?'Toutes les séances sont terminées !'
    :'Plus que '+reste+' séance'+(reste>1?'s':'')+'  restante'+(reste>1?'s':'')+'  !';
  navigator.serviceWorker.ready.then(function(reg){
    reg.showNotification('OFC Coach — '+nom.split(' ')[0], {body:msg,tag:'seance-'+nom});
  }).catch(function(){
    new Notification('OFC Coach — '+nom.split(' ')[0], {body:msg});
  });
}

function checkAlertesNotif(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var alertes=clients.filter(function(c){
    return c.seancesPrevues&&(c.seancesPrevues-c.seancesEffectuees)<=2&&c.statut==='Actif';
  });
  if(!alertes.length)return;
  navigator.serviceWorker.ready.then(function(reg){
    alertes.forEach(function(c){
      var reste=c.seancesPrevues-c.seancesEffectuees;
      reg.showNotification('OFC Coach ⚠️ '+c.nom.split(' ')[0],{
        body:reste===0?'Pack terminé — penser au renouvellement':'Plus que '+reste+' séance'+(reste>1?'s':'')+' restante'+(reste>1?'s':''),
        tag:'alerte-'+c.id
      });
    });
  }).catch(function(){});
}

function showBackup(){
  if(confirm('Exporter les données ?\n\nChoisir "Annuler" pour importer à la place.')){
    exportData();
  } else {
    document.getElementById('import-file').click();
  }
}

function exportData(){
  var json=JSON.stringify({version:'ofc-crm-v1',date:new Date().toISOString(),clients:clients},null,2);
  var blob=new Blob([json],{type:'application/json'});
  var url=URL.createObjectURL(blob);
  var a=document.createElement('a');
  var d=new Date().toLocaleDateString('fr-FR').replace(/\//g,'-');
  a.href=url;a.download='OFC-Sauvegarde-CRM-'+d+'.json';
  document.body.appendChild(a);a.click();
  document.body.removeChild(a);URL.revokeObjectURL(url);
  toast('Données exportées ✓');
}

function importData(e){
  var file=e.target.files[0];
  if(!file)return;
  var reader=new FileReader();
  reader.onload=function(ev){
    try{
      var data=JSON.parse(ev.target.result);
      var imported=data.clients||data;
      if(!Array.isArray(imported)||!imported.length)throw new Error();
      if(!confirm('Restaurer '+imported.length+' cliente(s) ?\n\n⚠️ Les données actuelles seront remplacées.')){
        e.target.value='';return;
      }
      clients=imported;
      nextId=Math.max.apply(null,clients.map(function(c){return c.id||0}))+1;
      save();renderAll();
      toast('Données restaurées ✓ ('+imported.length+' clientes)');
    }catch(err){
      toast('Fichier invalide — importation annulée');
    }
    e.target.value='';
  };
  reader.readAsText(file);
}

function checkMensurationReminder(){
  if(!('Notification' in window)||Notification.permission!=='granted')return;
  var now=new Date();
  clients.filter(function(c){return c.statut==='Actif'&&c.mesures&&c.mesures.length;}).forEach(function(c){
    var sorted=c.mesures.slice().sort(function(a,b){
      var pa=a.date.split('/'),pb=b.date.split('/');
      return new Date(+pb[2],+pb[1]-1,+pb[0])-new Date(+pa[2],+pa[1]-1,+pa[0]);
    });
    var last=sorted[0];
    var p=last.date.split('/');
    if(p.length!==3)return;
    var lastDate=new Date(+p[2],+p[1]-1,+p[0]);
    var jours=Math.round((now-lastDate)/(1000*60*60*24));
    if(jours>=28){
      navigator.serviceWorker.ready.then(function(reg){
        reg.showNotification('OFC Coach 📏 '+c.nom.split(' ')[0],{
          body:'Rappel mensurations — dernier relevé il y a '+jours+' j',
          tag:'mensuration-'+c.id
        });
      }).catch(function(){});
    }
  });
}

document.getElementById('today-date').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
updateNotifBtn();
renderAll();
checkAlertesNotif();
checkMensurationReminder();

// ── SAUVEGARDE AUTOMATIQUE ───────────────────────────────────
// Télécharge un fichier de sauvegarde JSON une fois par jour à l'ouverture,
// pour ne plus jamais dépendre uniquement du stockage local du navigateur.
function afficherDerniereSauvegarde(){
  var last=localStorage.getItem('ofc_crm_lastbackup');
  var el=document.getElementById('last-backup-date');
  if(!el)return;
  el.textContent=last?('💾 Dernière sauvegarde : '+last):'⚠️ Aucune sauvegarde pour l\'instant';
}
function autoBackupSiNecessaire(){
  var today=new Date().toLocaleDateString('fr-FR');
  var last=localStorage.getItem('ofc_crm_lastbackup');
  if(last!==today && clients && clients.length){
    try{exportData();}catch(e){}
    localStorage.setItem('ofc_crm_lastbackup',today);
  }
  afficherDerniereSauvegarde();
}
autoBackupSiNecessaire();
</script>
