<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="OFC Outils">
<title>Mes outils — Ornella Fit Coaching</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --accent:#C96358;--accent-light:#FAECE7;
  --bg:#FAF8F5;--surface:#FFFFFF;
  --text:#1E1616;--text2:#7A6E6E;
  --border:#E8E0D8;--border2:#D4C8C0;
  --radius:16px;--radius-sm:10px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

/* PASSWORD */
#pwd-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:30px}
.pwd-box{background:var(--surface);border-radius:22px;padding:32px 24px;width:100%;max-width:340px;text-align:center;border:1px solid var(--border)}
.pwd-logo{font-size:44px;margin-bottom:14px}
.pwd-title{font-size:20px;font-weight:800;color:var(--text);margin-bottom:4px}
.pwd-sub{font-size:13px;color:var(--text2);margin-bottom:24px}
.pwd-input{width:100%;padding:14px 16px;border:1.5px solid var(--border2);border-radius:var(--radius-sm);font-size:17px;background:var(--surface);color:var(--text);text-align:center;letter-spacing:3px;-webkit-appearance:none;margin-bottom:12px}
.pwd-input:focus{outline:none;border-color:var(--accent)}
.pwd-btn{width:100%;padding:15px;background:var(--accent);color:white;border:none;border-radius:var(--radius-sm);font-size:16px;font-weight:700;cursor:pointer}
.pwd-error{font-size:12px;color:#993C1D;margin-top:10px;display:none}

/* MAIN */
#main-screen{display:none;min-height:100vh;padding:40px 20px 60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px}
.brand{text-align:center;margin-bottom:8px}
.brand-logo{font-size:48px;margin-bottom:10px}
.brand-title{font-size:22px;font-weight:800;color:var(--accent);letter-spacing:-0.5px}
.brand-sub{font-size:14px;color:var(--text2);margin-top:4px}
.tools-grid{width:100%;max-width:380px;display:flex;flex-direction:column;gap:14px}
.tool-btn{display:flex;align-items:center;gap:16px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:20px 22px;text-decoration:none;color:var(--text);transition:border-color .2s,transform .1s;cursor:pointer}
.tool-btn:active{transform:scale(0.97);border-color:var(--accent)}
.tool-icon{font-size:32px;flex-shrink:0}
.tool-text{text-align:left}
.tool-name{font-size:17px;font-weight:700;color:var(--text);margin-bottom:2px}
.tool-desc{font-size:13px;color:var(--text2)}
.tool-arrow{margin-left:auto;font-size:20px;color:var(--accent);flex-shrink:0}
</style>
</head>
<body>

<div id="pwd-screen">
  <div class="pwd-box">
    <div class="pwd-logo">🏋️‍♀️</div>
    <div class="pwd-title">Ornella Fit Coaching</div>
    <div class="pwd-sub">Espace privé — accès réservé</div>
    <input class="pwd-input" id="pwd-input" type="password" placeholder="Mot de passe"
      onkeydown="if(event.key==='Enter')tryPwd()">
    <button class="pwd-btn" onclick="tryPwd()">Accéder →</button>
    <div class="pwd-error" id="pwd-error">Mot de passe incorrect</div>
  </div>
</div>

<div id="main-screen">
  <div class="brand">
    <div class="brand-logo">🏋️‍♀️</div>
    <div class="brand-title">Ornella Fit Coaching</div>
    <div class="brand-sub">Mes outils</div>
  </div>
  <div class="tools-grid">
    <a class="tool-btn" href="crm.html">
      <span class="tool-icon">📋</span>
      <div class="tool-text">
        <div class="tool-name">CRM Clientes</div>
        <div class="tool-desc">Suivi, séances, mensurations</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>
    <a class="tool-btn" href="facturation.html">
      <span class="tool-icon">🧾</span>
      <div class="tool-text">
        <div class="tool-name">Devis &amp; Factures</div>
        <div class="tool-desc">Générer et télécharger en PDF</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>
    <a class="tool-btn" href="dashboard.html">
      <span class="tool-icon">📊</span>
      <div class="tool-text">
        <div class="tool-name">Dashboard business</div>
        <div class="tool-desc">Objectif, prospects, scripts, charges</div>
      </div>
      <span class="tool-arrow">›</span>
    </a>
  </div>
</div>

<script>
var AUTH_KEY='ofc_tools_auth';
function tryPwd(){
  var v=document.getElementById('pwd-input').value;
  if(v==='ornellaITALIA18'){
    localStorage.setItem(AUTH_KEY,'ok');
    document.getElementById('pwd-screen').style.display='none';
    document.getElementById('main-screen').style.display='flex';
    document.getElementById('pwd-input').value='';
  } else {
    document.getElementById('pwd-error').style.display='block';
    document.getElementById('pwd-input').value='';
  }
}
(function(){
  if(localStorage.getItem(AUTH_KEY)==='ok'){
    document.getElementById('pwd-screen').style.display='none';
    document.getElementById('main-screen').style.display='flex';
  }
})();
</script>
</body>
</html>
